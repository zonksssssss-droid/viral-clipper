services:
  app:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - clipper-data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  clipper-data:
  caddy-data:
